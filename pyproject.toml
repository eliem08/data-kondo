[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-kondo"
version = "0.1.0"
description = "Marie Kondo for company data: clean it up so agents can use it"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
data-kondo = "data_kondo.__main__:main"

[tool.setuptools]
packages = ["data_kondo"]
